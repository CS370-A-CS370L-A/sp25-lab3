name: Grade Java Code

on: [push]

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install xmllint
        run: sudo apt-get install -y libxml2-utils

      - name: Run Maven tests
        id: maven-test
        run: mvn test -Dmaven.test.failure.ignore=true

      - name: Generate Grade and Append Failing Tests
        run: |
          # Check if the Maven build was successful
          if [ $? -eq 0 ]; then
            # Parse the JUnit XML file
            if [ -f "target/surefire-reports/TEST-edu.whitman.MuseumTest.xml" ]; then
              # Extract the number of failures and errors from the XML file
              FAILURES=$(xmllint --xpath 'string(//testsuite/@failures)' target/surefire-reports/TEST-edu.whitman.MuseumTest.xml)
              ERRORS=$(xmllint --xpath 'string(//testsuite/@errors)' target/surefire-reports/TEST-edu.whitman.MuseumTest.xml)

              # Determine the grade based on failures and errors
              if [ "$FAILURES" -eq 0 ] && [ "$ERRORS" -eq 0 ]; then
                echo "Grade: 1 (All tests passed)" > grade.txt
              else
                echo "Grade: 0 ($FAILURES test(s) failed, $ERRORS error(s))" > grade.txt
                echo "" >> grade.txt
                echo "=== Failing Tests ===" >> grade.txt

                # Extract and append the names of failing tests
                FAILING_TESTS=$(xmllint --xpath '//testcase[failure or error]/@name' target/surefire-reports/TEST-ed.whitman.LibraryTest.xml 2>/dev/null || true)
                echo "$FAILING_TESTS" | sed 's/name="\([^"]*\)"/- \1/g' >> grade.txt
              fi
            else
              echo "Grade: 0 (Test report not found)" > grade.txt
            fi
          else
            echo "Grade: 0 (Build failed)" > grade.txt
          fi

      - name: Show Grade and Failing Tests
        run: cat grade.txt